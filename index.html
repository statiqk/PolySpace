<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Avant-Poste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#000;color:#eef2ff;font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(16,20,36,.52);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 30px rgba(0,0,0,.25)}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none;z-index:10}
#res{display:flex;gap:4px;pointer-events:auto}
.r{flex:1;min-width:0;border-radius:13px;padding:6px 6px 5px}
.r small{display:block;font-size:8.5px;letter-spacing:.7px;text-transform:uppercase;color:#9aa6c8;white-space:nowrap}

.r.warn{border-color:rgba(255,110,90,.65);background:rgba(70,16,20,.55)}
.r .mini{height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
.r .mini span{display:block;height:100%;border-radius:3px}
#title{margin-top:12px;padding-left:6px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
#loc{font-size:11px;font-weight:700;letter-spacing:2px;color:#aab4d6;text-shadow:0 2px 10px #000}
#name{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.05;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;max-width:calc(100vw - 120px)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#speed{white-space:nowrap;pointer-events:auto;border-radius:13px;padding:8px 11px;font-size:13px;font-weight:800;cursor:pointer}
#obj{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 86px);border-radius:20px;padding:11px 13px;display:flex;align-items:center;gap:12px;z-index:9;transition:transform .35s,opacity .35s}
#obj .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:linear-gradient(135deg,#ff9a3d,#ff5a3d);box-shadow:0 6px 18px rgba(255,100,60,.4)}
#obj .t{font-size:10.5px;color:#ffb36b;font-weight:800;letter-spacing:1.2px}
#obj .m{font-size:14.5px;font-weight:700;margin-top:1px}
#obj .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
#obj .bar span{display:block;height:100%;background:linear-gradient(90deg,#ff9a3d,#ffd36b);border-radius:5px;transition:width .4s}
#obj .v{font-size:17px;font-weight:800;white-space:nowrap}
#nav{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-around;z-index:12;background:linear-gradient(180deg,rgba(6,8,18,0),rgba(6,8,18,.9) 45%);}
#nav button{background:none;border:0;color:#7d88a8;font:inherit;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:6px 0;cursor:pointer}
#nav button span{font-size:22px;filter:grayscale(1) opacity(.65);transition:.2s}
#nav button.on{color:#fff}#nav button.on span{filter:none;transform:translateY(-2px)}
.dot{width:5px;height:5px;border-radius:50%;background:#7fd3ff;box-shadow:0 0 10px #7fd3ff;opacity:0}#nav button.on .dot{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:28px 28px 0 0;background:rgba(12,15,30,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.14);padding:10px 14px calc(env(safe-area-inset-bottom) + 100px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:78vh;overflow-y:auto;touch-action:pan-y}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:0 auto 12px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh h2{font-size:21px;font-weight:800;letter-spacing:-.3px}
.x{width:34px;height:34px;border-radius:12px;border:0;color:#fff;font-size:15px;background:rgba(255,255,255,.08);cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;font:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.07);color:#9aa6c8;white-space:nowrap;cursor:pointer}
.tabs button.on{background:#fff;color:#0a0d1d}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.card{border-radius:18px;padding:13px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.card b{font-size:15px}
.card p{font-size:12.5px;color:#9aa6c8;margin-top:3px;line-height:1.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;font:inherit;font-weight:800;color:#fff;border-radius:15px;padding:12px 16px;font-size:15px;cursor:pointer}
.go{background:linear-gradient(135deg,#ff9a3d,#ff5a3d);box-shadow:0 8px 24px rgba(255,100,60,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.blue{background:linear-gradient(135deg,#3dc1ff,#5a6bff);box-shadow:0 8px 24px rgba(70,140,255,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.ghost{background:rgba(255,255,255,.09)}

#place{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:25;border-radius:22px;padding:12px;display:none}
#place.show{display:block}
#place .hint{font-size:12.5px;color:#9aa6c8;margin-bottom:9px;text-align:center}
#info{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:15;border-radius:22px;padding:14px;display:none;max-height:62vh;overflow-y:auto}
#info.show{display:block}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stat s{text-decoration:line-through}.stat span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.08)}
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
#modal.show{display:flex}
#modal .box{width:100%;max-width:520px;margin:0 10px calc(env(safe-area-inset-bottom) + 14px);border-radius:26px;padding:16px;background:rgba(16,14,28,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,110,90,.35);animation:pop .4s cubic-bezier(.2,1.3,.3,1)}
@keyframes pop{from{transform:translateY(40px) scale(.96);opacity:0}}
.tag{display:inline-flex;font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px;background:rgba(255,80,80,.18);color:#ff9a8a;letter-spacing:.5px}

#modal p{font-size:13.5px;color:#b8c0dc;line-height:1.45}
.choice{display:block;width:100%;text-align:left;border-radius:17px;padding:12px 14px;margin-top:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#fff;font:inherit;cursor:pointer}
.choice b{font-size:15px}.choice div{font-size:12px;color:#9aa6c8;margin-top:2px}
.choice:active{transform:scale(.98)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 236px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.toast{padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:700;max-width:88vw;text-align:center}.toast.loud{border-color:rgba(255,110,90,.6);font-size:13.5px}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#vign{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));transition:background 1s}
@keyframes gl{0%{opacity:1}50%{opacity:.3;transform:translateX(1px)}100%{opacity:1}}.glitch{color:#9fffb0;font-family:monospace;animation:gl .25s infinite}

#vign.dust{background:linear-gradient(180deg,rgba(150,108,62,.42),rgba(120,88,55,.26) 50%,rgba(95,70,48,.42)),radial-gradient(ellipse at center,transparent 45%,rgba(60,40,20,.5))}

#vign.storm{background:radial-gradient(ellipse at center,rgba(255,60,30,.06) 30%,rgba(255,60,40,.45))}
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 64px) 16px calc(env(safe-area-inset-bottom) + 26px);background:linear-gradient(180deg,rgba(3,4,10,.25) 0%,rgba(3,4,10,0) 28%,rgba(3,4,10,0) 48%,rgba(3,4,10,.9) 76%);transition:opacity .9s;pointer-events:auto}

.sp-top{text-align:center;animation:spin 1.4s cubic-bezier(.2,.9,.3,1)}

.sp-logo{font-size:60px;font-weight:800;letter-spacing:-2.5px;line-height:.95;margin-top:8px;background:linear-gradient(180deg,#fff 22%,#9fd8ff 62%,#6a7bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 26px rgba(90,160,255,.45))}
.sp-line{width:120px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,#7fd3ff,transparent)}

.sp-card{display:none;gap:11px;align-items:center;border-radius:20px;padding:10px 12px;margin-bottom:12px}.sp-card.on{display:flex}
.sp-th{width:62px;height:62px;border-radius:14px;flex:none;background:#14182c center/cover;display:grid;place-items:center;font-size:28px}
.sp-card .k{font-size:10px;color:#9fd8ff;font-weight:800;letter-spacing:1px}.sp-card b{font-size:16px;display:block;margin-top:1px}
.sp-chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.sp-chips span{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.1)}
.sp-main{width:100%;padding:18px;font-size:18px}
.sp-row{display:flex;gap:8px;margin-top:8px}.sp-row .btn{padding:13px;font-size:14px}.sp-row .btn:first-child{flex:1}.sp-ic{width:52px;font-size:18px!important;padding:12px 0!important}
.sp-panel{display:none;border-radius:20px;padding:12px 14px;margin-top:10px}.sp-panel.on{display:block;animation:pop .35s cubic-bezier(.2,1.3,.3,1)}
.sp-panel h4{font-size:15px;margin-bottom:8px}.sp-opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px}
.sp-tg{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(255,255,255,.07)}.sp-tg button{border:0;font:inherit;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:8px;background:none;color:#9aa6c8;cursor:pointer}.sp-tg button.on{background:#fff;color:#0a0d1d}
.sp-rec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.sp-rec div{border-radius:13px;background:rgba(255,255,255,.06);padding:8px 4px}.sp-rec b{font-size:19px;display:block}.sp-rec small{font-size:10px;color:#9aa6c8}
.sp #hud,.sp #side,.sp #nav,.sp #obj,.sp #alert,.sp #toasts,.sp #info{visibility:hidden!important;pointer-events:none}#hud,#side,#nav,#obj,#alert{transition:opacity .6s}
.sp-upd{display:none;border-radius:18px;padding:11px 14px;margin-bottom:10px;border-color:rgba(127,211,255,.5)}.sp-upd.on{display:block;animation:pop .35s}
.sp-upd .h{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.sp-upd .h span:first-child{color:#7fd3ff;letter-spacing:.5px}
.sp-upd .b{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}.sp-upd .b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3dc1ff,#7fd3ff);transition:width .25s}
.sp-upd small{display:block;font-size:11.5px;color:#9aa6c8;margin-top:6px}
.wn li{list-style:none;display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px;line-height:1.4;text-align:left}.wn li>span{font-size:19px}.wn small{color:#9aa6c8;font-size:12px}
.sp-ver{text-align:center;font-size:10.5px;color:#5c6688;margin-top:12px}
#load{position:fixed;inset:0;z-index:70;background:#03040a;display:grid;place-items:center;font-size:14px;color:#8a93b5;letter-spacing:2px;transition:opacity .8s}
#load.hide{opacity:0;pointer-events:none}
.res-list .card{display:flex;gap:12px;align-items:center}
.res-list .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:rgba(255,255,255,.07)}
.done{color:#6dffb5;font-weight:800;font-size:13px}
.log{font-size:12.5px;color:#aab4d6;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.log em{font-style:normal;color:#6c7699;margin-right:6px}
@media (min-width:700px){.sheet,#place,#info,#obj{max-width:520px;margin:0 auto}#obj,#info{left:50%;transform:translateX(-50%);width:520px}#res{max-width:620px}}
 
.bal{display:flex;gap:4px}.bal span{font-size:11.5px;font-weight:800;padding:5px 8px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}

.seg2 button{flex:1;border:0;font:inherit;font-size:11.5px;font-weight:800;padding:8px 0;border-radius:10px;color:#9aa6c8;background:none;cursor:pointer;white-space:nowrap}.seg2 button.on{background:#fff;color:#0a0d1d}.seg2 i{font-style:normal;font-size:9.5px;opacity:.55;margin-left:2px}
.mods{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
.mcard{border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);overflow:hidden;position:relative;cursor:pointer;transition:transform .15s}.mcard:active{transform:scale(.97)}

/* ================== SANTÉ & SOCIÉTÉ ================== */
const unavailable=p=>p.sick>0||p.rest>0||p.child>0||S.strike>0;
// repos automatique + relais
function startRest(p){p.rest=14;p.auto=1;const q=S.people.find(q=>!q.a&&!onExp(q)&&!unavailable(q)&&!(q.hurt>0)&&(q.fat||0)<50&&!q.relay);
  if(q){q.a=p.a;q.relay=p.n;toast(`😴 ${p.n} part se reposer · ${q.n} prend le relais`,'#9fe0ff');logx(`${p.n} se repose, ${q.n} prend le relais.`)}else{toast(`😴 ${p.n} part se reposer quelques heures`,'#9fe0ff');logx(`${p.n} part se reposer.`)}}
function endRest(p){p.auto=0;for(const q of S.people)if(q.relay===p.n){if(q.a===p.a)q.a=null;delete q.relay}toast(`😴 ${p.n} reprend son poste`,'#9fe0ff')}
function killColon(p,why){S.people=S.people.filter(x=>x!==p);S.colons=Math.max(0,S.colons-1);S.grief=48;S.deaths=(S.deaths||0)+1;prest(-5,'décès');
  toast(`🕯️ ${p.n} est décédé·e (${why})`,'#c9b8ff');logx(`${p.n} (${JOBS[p.j].n}) est décédé·e : ${why}. La base est en deuil.`);vib([60,80,60]);
  if(!memorial.visible){memorial.visible=true}}
function infect(p,why){if(p.sick>0||p.imm>0)return false;p.sick=40+Math.floor(Math.random()*24);p.sev=Math.random();if(why)logx(`${p.n} est malade (${why}).`);return true}
function startEpidemic(){const pool=S.people.filter(p=>!(p.sick>0)&&!onExp(p));if(!pool.length)return null;const p=pool[Math.floor(Math.random()*pool.length)];infect(p,'virus');S.epi=1;return p}
function tickHealth(){
  const hosp=active('hopital'),vac=has('vaccin'),park=active('parc');
  // contagion
  const sick=S.people.filter(p=>p.sick>0);
  // hôpital : lits d'isolement (3 par niveau), médecin = soins + dépistage
  const hb=S.b.filter(b=>b.t==='hopital'&&!b.dmg&&b.pwr!==false&&!(b.off>0));const beds=hb.reduce((a,b)=>a+3*lvOf(b),0);
  const doc=hb.some(b=>workersOf(b).some(p=>p.j==='med'));S.people.forEach(p=>p.iso=0);
  sick.slice().sort((a,b)=>(b.sev||0)-(a.sev||0)).slice(0,beds).forEach(p=>p.iso=1);
  for(const s of sick){if(s.iso)continue;const mb=s.a&&S.b.find(b=>bkey(b)===s.a);if(mb&&mb.quar>0)continue;
    for(const o of S.people){if(o===s||o.sick>0||o.imm>0||onExp(o))continue;const sameMod=o.a&&o.a===s.a;const ob=o.a&&S.b.find(b=>bkey(b)===o.a);if(ob&&ob.quar>0)continue;
      const ch=(sameMod?.07:.012)*(vac?.3:1);if(Math.random()<ch){infect(o);if(doc&&S.people.filter(p=>p.iso).length<beds){o.iso=1;toast(`🩺 Dépistage : ${o.n} est malade, isolé·e à l'hôpital`,'#b6ff9a',1)}else toast(`🦠 ${o.n} a attrapé le virus`,'#b6ff9a')}}}
  for(const p of S.people){
    if(p.sick>0){p.sick-=p.iso&&doc?3:hosp?2:1;if(p.sick<=0){p.sick=0;p.imm=240;logx(`${p.n} est guéri·e.`)}
      else if(p.sev>.8&&!hosp&&Math.random()<.006){killColon(p,'maladie');continue}}
    if(p.imm>0)p.imm--;if(p.rest>0){p.rest--;if(p.rest===0&&p.auto)endRest(p)}if(p.child>0){p.child--;if(p.child===0)toast(`🧒 ${p.n} est assez grand·e pour travailler`,'#9fe0ff')}
    // fatigue
    const working=p.a&&!unavailable(p)&&!onExp(p)&&!(p.hurt>0);p.fat=clamp((p.fat||0)+(working?.55:(p.rest>0&&p.auto?-5:-1.6)*restK(p)),0,100);
    if(p.rest>0&&p.auto&&p.fat<=15){p.rest=0;endRest(p)}
    if(working&&p.fat>=80&&p.fat<98){const busy=S.people.some(q=>q!==p&&q.a===p.a&&q.rest>0&&q.auto);if(!busy||p.fat>=92)startRest(p)}
    if(p.fat>=98&&working){p.rest=12;toast(`😴 ${p.n} s'effondre de fatigue (12 h de repos)`,'#ffcf9a')}
    if(p.fat>80&&Math.random()<.004)infect(p,'épuisement');
    // perte osseuse et radiations
    p.bone=clamp((p.bone||0)+(park?-.25:.12),0,100);if(p.bone>90&&!(p.sick>0)&&Math.random()<.02){infect(p,'fracture, perte osseuse');p.bone=40}
    if(p.rad>0){p.rad=Math.max(0,p.rad-.3);if(p.rad>60&&!(p.sick>0)&&Math.random()<.03)infect(p,'irradiation')}
  }
  if(S.epi&&!S.people.some(p=>p.sick>0)){S.epi=0;toast('✅ L\'épidémie est terminée','#6dffb5');logx('Fin de l\'épidémie.')}
  if(!S.epi&&S.sol>3&&Math.random()<.0018){const p=startEpidemic();if(p){toast(`🦠 Épidémie ! ${p.n} est le premier cas`,'#b6ff9a');logx('Début d\'une épidémie.')}}
  for(const b of S.b)if(b.quar>0)b.quar--;
  // naissances
  if(hosp&&S.moral>72&&S.colons<rates.cap&&Math.random()<.004){S.colons++;syncPeople();const p=S.people[S.people.length-1];p.child=96;p.a=null;toast(`👶 Naissance de ${p.n.split(' ')[0]} !`,'#ffd6e8');logx(`Naissance : ${p.n}. Toute la base fait la fête.`);S.moral=Math.min(100,S.moral+8)}
}
function tickSociety(){
  if(S.grief>0)S.grief--;if(S.conflict>0)S.conflict--;
  // conflits
  const crowded=rates.cap<S.colons;if((crowded||S.moral<42)&&S.people.length>2&&Math.random()<.025){const a=S.people[Math.floor(Math.random()*S.people.length)];let b2=S.people[Math.floor(Math.random()*S.people.length)];if(a!==b2){a.tr-=2;b2.tr-=2;S.conflict=12;toast(`⚡ Dispute entre ${a.n.split(' ')[0]} et ${b2.n.split(' ')[0]}`,'#ffcf9a');logx(`Dispute entre ${a.n} et ${b2.n} (${crowded?'surpopulation':'tensions'}).`)}}
  // grève
  if(S.strike>0){S.strike--;if(S.strike<=0){toast('✊ Fin de la grève','#6dffb5');logx('Fin de la grève.')}}
  S.lowMoral=S.moral<30?(S.lowMoral||0)+1:0;if(S.lowMoral>=24&&!(S.strike>0)&&!modalOpen){S.lowMoral=0;strikeEvent()}

  if(S.moral<35&&Math.random()<.04){const k=['rego','food','water','rare'][Math.floor(Math.random()*4)];const lost=Math.max(1,Math.round(S[k]*(.03+Math.random()*.05)));S[k]=Math.max(0,S[k]-lost);

  else if(comTab==='ct'){h+=S.contracts.map(c=>{const g=GOODS[c.k],have=Math.floor(S[c.k]||0),ok=have>=c.q;return `<div class="card" style="${c.acc?'border-color:rgba(127,211,255,.5)':''}"><div class="row"><div><div style="font-size:10.5px;color:#9aa6c8;font-weight:800;letter-spacing:.6px">${c.by.toUpperCase()}</div><b>${g.i} Livrer ${fmt(c.q)} ${g.n.toLowerCase()}</b></div><div style="text-align:right"><b style="color:#ffd36b">💰 ${fmtC(c.rew)}</b><p style="margin:0;color:#ffcf6b">⭐ +${c.pr}</p></div></div>

  else{const B=S.bilan;const net=netSol();
    h+=`<div class="card"><b>📊 Bilan quotidien</b>${[['🌍 Subvention de l\'agence',subsidy(),'#6dffb5'],['🏨 Touristes (station)',tourists(),'#6dffb5'],['🏛️ Taxe',taxEst().g,'#6dffb5'],['🏠 Loyers',lodgeEst(),'#6dffb5'],['👩‍🚀 Salaires ('+S.colons+' colons)',-salaries(),'#ff9a8a'],['🧾 Loyer du terrain',-rent(),'#ff9a8a']].map(([l,v,c])=>`<div class="row" style="margin-top:6px;font-size:13px"><span>${l}</span><b style="color:${v?c:'#9aa6c8'}">${v>0?'+':''}${fmtC(v)}</b></div>`).join('')}
      <div class="row" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)"><b>Par sol</b><b style="color:${net>=0?'#6dffb5':'#ff8a7a'}">${net>=0?'+':''}${fmtC(net)} cr</b></div>${B&&B.unpaid?'<p style="color:#ff9a8a">⚠️ Les derniers salaires n\'ont pas été payés.</p>':''}</div>`+
     `<div class="card"><div class="row"><b>⭐ Prestige ${Math.round(S.prestige)}/100</b><span style="font-size:12px;color:#9aa6c8">subvention +${Math.round(S.prestige*2.2)}</span></div><div class="ibar"><span style="width:${S.prestige}%;background:linear-gradient(90deg,#ffb347,#ffd36b)"></span></div><p>Il monte avec les objectifs, les contrats, les expéditions et le bon moral. Il baisse avec les décès, les grèves et les dettes.</p></div>`+
     (S.loan?`<div class="card" style="border-color:rgba(255,180,100,.45)"><b>🏦 Prêt en cours</b><div class="row" style="margin-top:6px"><span>À rembourser</span><b>💰 ${fmtC(S.loan.owe)}</b></div><div class="row"><span>Échéance</span><b style="color:${S.loan.left<=2?'#ff8a7a':'#fff'}">${S.loan.left>0?S.loan.left+' sols':'dépassée'}</b></div><p>Intérêts : 2 % par sol.</p><button class="btn ${S.cr>=S.loan.owe?'go':'ghost'}" id="repay" style="width:100%;margin-top:8px" ${S.cr>=S.loan.owe?'':'disabled'}>Rembourser 💰 ${fmtC(S.loan.owe)}</button></div>`
      :`<div class="card"><b>🏦 Banque terrienne</b><p>Un coup de pouce en cas de crise, avec 2 % d'intérêts par sol. Non remboursé à temps : embargo sur les navettes.</p>${[[1000,8],[2500,12]].map(([a,d])=>`<button class="btn blue" data-loan="${a}:${d}" style="width:100%;margin-top:8px">Emprunter 💰 ${fmtC(a)} · ${d} sols</button>`).join('')}</div>`)}
  H.innerHTML=tabs+h;
  H.querySelectorAll('[data-ct2]').forEach(b=>b.onclick=()=>{comTab=b.dataset.ct2;renderCommerce()});
  H.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{S.tax=+b.dataset.tx;if(S.tax<3)S.taxStrike=0;toast(`🏛️ Taxe ${TAXL[S.tax].n}`,'#ffd36b');save();renderCommerce();renderHUD&&renderHUD()});

  {const pt=$('#primeT');if(pt)pt.onclick=()=>{S.prime=!S.prime;toast(S.prime?'🎁 Prime activée · moral +6':'Prime désactivée','#ffd36b');save();renderCommerce()}}
  {const td=$('#taxDown');if(td)td.onclick=()=>{S.tax=2;S.taxStrike=0;save();renderCommerce()}}

  const ex=$('#express');if(ex)ex.onclick=()=>{if(S.cr<260)return;S.cr-=260;S.ship=1;toast('🚀 Navette express en route','#7fd3ff');save();renderCommerce()};
  H.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{const c=S.contracts.find(x=>x.id===b.dataset.acc);c.acc=true;c.left=c.days;toast('📜 Contrat accepté : '+c.by,'#7fd3ff');save();renderCommerce()});
  H.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const c=S.contracts.find(x=>x.id===b.dataset.dl);if((S[c.k]||0)<c.q)return;S[c.k]-=c.q;S.cr+=c.rew;prest(c.pr,'contrat honoré');S.contracts=S.contracts.filter(x=>x!==c);toast(`📦 Contrat livré : +${fmtC(c.rew)} cr`,'#6dffb5');logx(`Contrat livré à ${c.by} : +${c.rew} cr.`);save();renderCommerce()});

function checkObj(){while(S.obj<OBJ.length&&OBJ[S.obj].ok(S)){toast('🏆 Objectif atteint : '+OBJ[S.obj].t+' · +250 ⛏','#ffd36b');logx('Objectif : '+OBJ[S.obj].t+' ✓');S.rego+=250;S.obj++;prest(3,'objectif');}}
function logx(m){S.log.unshift({s:S.sol,h:S.hour,m});S.log.length=Math.min(S.log.length,60)}
/* ---- notifications : file d'attente, priorités, regroupement ---- */
// 0 = discret (historique seulement) · 1 = normal · 2 = important (passe devant)
const QUIET=[/^⭐ Prestige/,/^📦 \d+ .* disparu/,/^🦠 .* a attrapé/,/^😴 /,/^⚡ Dispute/,/^🧑‍🔧 /,/^⚠️ .* bas$/,/^🌑 Nuit lunaire dans/,/^🧒 /,/^💻 Système/,/^📡 Liaison avec/,/^✅ /,/^😮‍💨 /,/^💬 Demande satisfaite/,/^🚀 Navette de ravitaillement/,/^🛒 Commandes livrées/,/^👋 Bienvenue/,/^📦 \+/,/^🧑‍🚀 .* rejoint/,/^📈|^📉/,/^🏆 /];
const LOUD=[/^💥 /,/^🕯️ /,/^⛔ /,/^💸 /,/^🦠 Épidémie/,/^✊ /,/^🔌 /,/^🌑 Nuit lunaire :/,/^☢️ /,/^😢 /,/^🚀 Navette en avarie/];
const NOTIF={q:[],shown:0,last:{},hist:[],unread:0,busy:0};
function toast(m,c,pri){if(pri===undefined)pri=LOUD.some(r=>r.test(m))?2:QUIET.some(r=>r.test(m))?0:1;
  const now=performance.now();const key=m.replace(/[\d\s,.+−-]+/g,'#');
  NOTIF.hist.unshift({m,c,s:S?S.sol:0,h:S?S.hour:0,pri});if(NOTIF.hist.length>40)NOTIF.hist.length=40;if(pri>0)NOTIF.unread++;
  if(pri===0)return;
  if(NOTIF.last[key]&&now-NOTIF.last[key]<20000)return;NOTIF.last[key]=now;
  const ex=NOTIF.q.find(t=>t.key===key);if(ex){ex.n++;ex.m=m;return}
  if(NOTIF.q.length>=4){const i=NOTIF.q.findIndex(t=>t.pri<pri);if(i<0)return;NOTIF.q.splice(i,1)}
  const item={m,c,pri,key,n:1};if(pri===2)NOTIF.q.unshift(item);else NOTIF.q.push(item);pumpToast()}
function pumpToast(){if(NOTIF.busy>=(NOTIF.q[0]&&NOTIF.q[0].pri===2?2:1)||!NOTIF.q.length)return;const t=NOTIF.q.shift();NOTIF.busy++;
  const d=document.createElement('div');d.className='toast glass'+(t.pri===2?' loud':'');d.textContent=t.m+(t.n>1?` (×${t.n})`:'');d.style.color=t.c||'#fff';$('#toasts').appendChild(d);
  const life=t.pri===2?3600:2400;d.style.animation=`tin .35s ease, tout .4s ease ${life/1000-.4}s forwards`;
  setTimeout(()=>{d.remove();NOTIF.busy--;setTimeout(pumpToast,250)},life)}
function hardReset(){over=true;try{localStorage.removeItem('avantposte1')}catch(_){}
  // remise à zéro sur place (le rechargement de page est souvent bloqué dans l'appli)
  for(const b of [...S.b])removeBuilding(b);S=newState();LUNAR=false;storm=0;meteors=[];shipState='idle';shuttle.visible=false;
  S.people=[];for(const j of ['pil','ing','bot','tec'])S.people.push(newPerson(j));S.people[0].n='Léa M.';S.people[1].n='Kenji O.';S.people[2].n='Amara S.';S.people[3].n='Tom B.';
  ecoInit();syncPeople();ensureSites();for(const b of S.b)addBuilding(b,false);rebuildStation();for(const p of S.people)autoAssign(p);
  NOTIF.q=[];NOTIF.hist=[];$('#toasts').innerHTML='';modalOpen=false;$('#modal').classList.remove('show');if(mode!=='base')setMode('base');setView('base');
  camGo={p:camera.position.clone(),t:controls.target.clone(),k:0};over=false;acc=0;computeRates();lastObj=null;lastAlertH=null;renderHUD();save();
  logx('La base Séléné est fondée. Bonne chance, commandant·e !');toast('🔄 Nouvelle partie','#7fd3ff',2)}
function gameOver(){if(over)return;over=true;modalOpen=true;try{localStorage.removeItem('avantposte1')}catch(_){}$('#mbox').innerHTML=`<span class="tag">FIN DE MISSION</span><h3>La base est vide</h3><p>Tous les colons sont repartis. Tu as tenu ${S.sol} sols.</p><button class="choice" id="again"><b>Recommencer une base</b><div>Nouvelle partie</div></button>`;$('#modal').classList.add('show');
  $('#again').onclick=()=>hardReset()}

const sgn=n=>(n>=0?'+':'')+(Math.abs(n)<10?n.toFixed(1).replace('.',','):Math.round(n));
const o2Cap=()=>120+count('recycleur')*80+S.colons*8,foodCap=()=>120+count('serre')*80+S.colons*8,waterCap=()=>150+count('extracteur')*120+S.colons*6;

function tryBuild(k){const d=DEFS[k];if(d.req&&!has(d.req))return toast('🔒 '+d.name+' : recherche requise');if(d.unique&&count(k))return toast('Déjà construit');const c=bCost(k);if(!canPay(c))return toast('Il faut '+costTxt(c),'#ff8a7a');startPlace(k)}

    A.push({sev:3,ic:'🦠',t:`${sick.length} malade${sick.length>1?'s':''}`,sub:mb?(mb.quar>0?`${DEFS[mb.t].name} en quarantaine`:`Foyer : ${DEFS[mb.t].name}`):'Contagion possible',btn:mb&&!(mb.quar>0)?'Isoler':null,col:'#56b84a',fn:()=>{mb.quar=48;toast('🚧 '+DEFS[mb.t].name+' en quarantaine 48 h','#ffd36b');computeRates();save()},go:()=>openCrew('team')})}

const vnum=v=>String(v).split('.').map(Number).reduce((a,x,i)=>a+x*Math.pow(1000,2-i),0);

  try{const r=await fetch('./?v='+remote.version,{cache:'reload'});const tot=+(r.headers.get('content-length'))||300000;const rd=r.body.getReader();let got=0;
    for(;;){const {done,value}=await rd.read();if(done)break;got+=value.length;setP(Math.min(.95,got/tot))}
    await fetch('./',{cache:'reload'}).catch(()=>{});await fetch('index.html',{cache:'reload'}).catch(()=>{});setP(1)}catch(_){setP(1)}
  try{localStorage.setItem('ap_upd_try',remote.version)}catch(_){}save();$('#spUpd small').textContent='Redémarrage…';
