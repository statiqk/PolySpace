<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#000;color:#eef2ff;font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

#title{margin-top:12px;padding-left:6px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
#loc{font-size:11px;font-weight:700;letter-spacing:2px;color:#aab4d6;text-shadow:0 2px 10px #000}

#nav{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-around;z-index:12;background:linear-gradient(180deg,rgba(6,8,18,0),rgba(6,8,18,.9) 45%);}

#nav button.on{color:#fff}#nav button.on span{filter:none;transform:translateY(-2px)}
.dot{width:5px;height:5px;border-radius:50%;background:#7fd3ff;box-shadow:0 0 10px #7fd3ff;opacity:0}#nav button.on .dot{opacity:1}

.stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

#modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}

.toast{padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:700;max-width:88vw;text-align:center}.toast.loud{border-color:rgba(255,110,90,.6);font-size:13.5px}

.sp-main{width:100%;padding:18px;font-size:18px}
.sp-row{display:flex;gap:8px;margin-top:8px}.sp-row .btn{padding:13px;font-size:14px}.sp-row .btn:first-child{flex:1}.sp-ic{width:52px;font-size:18px!important;padding:12px 0!important}

.sp-panel h4{font-size:15px;margin-bottom:8px}.sp-opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px}
.sp-tg{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(255,255,255,.07)}.sp-tg button{border:0;font:inherit;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:8px;background:none;color:#9aa6c8;cursor:pointer}.sp-tg button.on{background:#fff;color:#0a0d1d}
.sp-rec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.sp-rec div{border-radius:13px;background:rgba(255,255,255,.06);padding:8px 4px}.sp-rec b{font-size:19px;display:block}.sp-rec small{font-size:10px;color:#9aa6c8}

.sp-upd .h{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.sp-upd .h span:first-child{color:#7fd3ff;letter-spacing:.5px}

.wn li{list-style:none;display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px;line-height:1.4;text-align:left}.wn li>span{font-size:19px}.wn small{color:#9aa6c8;font-size:12px}

#load{position:fixed;inset:0;z-index:70;background:#03040a;display:grid;place-items:center;font-size:14px;color:#8a93b5;letter-spacing:2px;transition:opacity .8s}
#load.hide{opacity:0;pointer-events:none}
.res-list .card{display:flex;gap:12px;align-items:center}
.res-list .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:rgba(255,255,255,.07)}

.bal{display:flex;gap:4px}.bal span{font-size:11.5px;font-weight:800;padding:5px 8px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}

function meteorShower(n,shield){

      meteors.push({t:-h*.9-.4,from:new THREE.Vector3(tx+60,90,tz-40),to:new THREE.Vector3(tx,1.2,tz),shield,b})}}

function siteReward(s,team){const k=(1+s.dist/25)*(1+(team.length-1)*.25);const sc=team.some(p=>p.j==='sci')?1.5:1;const R={};
  if(s.t==='glace'){R.water=Math.round(110*k);R.o2=Math.round(30*k)}

/* ================== SANTÉ & SOCIÉTÉ ================== */
const unavailable=p=>p.sick>0||p.rest>0||p.child>0||S.strike>0;
// repos automatique + relais
function startRest(p){p.rest=14;p.auto=1;const q=S.people.find(q=>!q.a&&!onExp(q)&&!unavailable(q)&&!(q.hurt>0)&&(q.fat||0)<50&&!q.relay);
  if(q){q.a=p.a;q.relay=p.n;toast(`😴 ${p.n} part se reposer · ${q.n} prend le relais`,'#9fe0ff');logx(`${p.n} se repose, ${q.n} prend le relais.`)}else{toast(`😴 ${p.n} part se reposer quelques heures`,'#9fe0ff');logx(`${p.n} part se reposer.`)}}
function endRest(p){p.auto=0;for(const q of S.people)if(q.relay===p.n){if(q.a===p.a)q.a=null;delete q.relay}toast(`😴 ${p.n} reprend son poste`,'#9fe0ff')}
function killColon(p,why){S.people=S.people.filter(x=>x!==p);S.colons=Math.max(0,S.colons-1);S.grief=48;S.deaths=(S.deaths||0)+1;prest(-5,'décès');
  toast(`🕯️ ${p.n} est décédé·e (${why})`,'#c9b8ff');logx(`${p.n} (${JOBS[p.j].n}) est décédé·e : ${why}. La base est en deuil.`);vib([60,80,60]);
  if(!memorial.visible){memorial.visible=true}}
function infect(p,why){if(p.sick>0||p.imm>0)return false;p.sick=40+Math.floor(Math.random()*24);p.sev=Math.random();if(why)logx(`${p.n} est malade (${why}).`);return true}
function startEpidemic(){const pool=S.people.filter(p=>!(p.sick>0)&&!onExp(p));if(!pool.length)return null;const p=pool[Math.floor(Math.random()*pool.length)];infect(p,'virus');S.epi=1;return p}
function tickHealth(){
  const hosp=active('hopital'),vac=has('vaccin'),park=active('parc');
  // contagion
  const sick=S.people.filter(p=>p.sick>0);
  // hôpital : lits d'isolement (3 par niveau), médecin = soins + dépistage
  const hb=S.b.filter(b=>b.t==='hopital'&&!b.dmg&&b.pwr!==false&&!(b.off>0));const beds=hb.reduce((a,b)=>a+3*lvOf(b),0);
  const doc=hb.some(b=>workersOf(b).some(p=>p.j==='med'));S.people.forEach(p=>p.iso=0);
  sick.slice().sort((a,b)=>(b.sev||0)-(a.sev||0)).slice(0,beds).forEach(p=>p.iso=1);
  for(const s of sick){if(s.iso)continue;const mb=s.a&&S.b.find(b=>bkey(b)===s.a);if(mb&&mb.quar>0)continue;
    for(const o of S.people){if(o===s||o.sick>0||o.imm>0||onExp(o))continue;const sameMod=o.a&&o.a===s.a;const ob=o.a&&S.b.find(b=>bkey(b)===o.a);if(ob&&ob.quar>0)continue;
      const ch=(sameMod?.07:.012)*(vac?.3:1);if(Math.random()<ch){infect(o);if(doc&&S.people.filter(p=>p.iso).length<beds){o.iso=1;toast(`🩺 Dépistage : ${o.n} est malade, isolé·e à l'hôpital`,'#b6ff9a',1)}else toast(`🦠 ${o.n} a attrapé le virus`,'#b6ff9a')}}}
  for(const p of S.people){
    if(p.sick>0){p.sick-=p.iso&&doc?3:hosp?2:1;if(p.sick<=0){p.sick=0;p.imm=240;logx(`${p.n} est guéri·e.`)}
      else if(p.sev>.8&&!hosp&&Math.random()<.006){killColon(p,'maladie');continue}}
    if(p.imm>0)p.imm--;if(p.rest>0){p.rest--;if(p.rest===0&&p.auto)endRest(p)}if(p.child>0){p.child--;if(p.child===0)toast(`🧒 ${p.n} est assez grand·e pour travailler`,'#9fe0ff')}
    // fatigue
    const working=p.a&&!unavailable(p)&&!onExp(p)&&!(p.hurt>0);p.fat=clamp((p.fat||0)+(working?.55:p.rest>0&&p.auto?-5:-1.6),0,100);
    if(p.rest>0&&p.auto&&p.fat<=15){p.rest=0;endRest(p)}
    if(working&&p.fat>=80&&p.fat<98){const busy=S.people.some(q=>q!==p&&q.a===p.a&&q.rest>0&&q.auto);if(!busy||p.fat>=92)startRest(p)}
    if(p.fat>=98&&working){p.rest=12;toast(`😴 ${p.n} s'effondre de fatigue (12 h de repos)`,'#ffcf9a')}
    if(p.fat>80&&Math.random()<.004)infect(p,'épuisement');
    // perte osseuse et radiations
    p.bone=clamp((p.bone||0)+(park?-.25:.12),0,100);if(p.bone>90&&!(p.sick>0)&&Math.random()<.02){infect(p,'fracture, perte osseuse');p.bone=40}
    if(p.rad>0){p.rad=Math.max(0,p.rad-.3);if(p.rad>60&&!(p.sick>0)&&Math.random()<.03)infect(p,'irradiation')}
  }
  if(S.epi&&!S.people.some(p=>p.sick>0)){S.epi=0;toast('✅ L\'épidémie est terminée','#6dffb5');logx('Fin de l\'épidémie.')}
  if(!S.epi&&S.sol>3&&Math.random()<.0018){const p=startEpidemic();if(p){toast(`🦠 Épidémie ! ${p.n} est le premier cas`,'#b6ff9a');logx('Début d\'une épidémie.')}}
  for(const b of S.b)if(b.quar>0)b.quar--;
  // naissances
  if(hosp&&S.moral>72&&S.colons<rates.cap&&Math.random()<.004){S.colons++;syncPeople();const p=S.people[S.people.length-1];p.child=96;p.a=null;toast(`👶 Naissance de ${p.n.split(' ')[0]} !`,'#ffd6e8');logx(`Naissance : ${p.n}. Toute la base fait la fête.`);S.moral=Math.min(100,S.moral+8)}
}
function tickSociety(){
  if(S.grief>0)S.grief--;if(S.conflict>0)S.conflict--;
  // conflits
  const crowded=rates.cap<S.colons;if((crowded||S.moral<42)&&S.people.length>2&&Math.random()<.025){const a=S.people[Math.floor(Math.random()*S.people.length)];let b2=S.people[Math.floor(Math.random()*S.people.length)];if(a!==b2){a.tr-=2;b2.tr-=2;S.conflict=12;toast(`⚡ Dispute entre ${a.n.split(' ')[0]} et ${b2.n.split(' ')[0]}`,'#ffcf9a');logx(`Dispute entre ${a.n} et ${b2.n} (${crowded?'surpopulation':'tensions'}).`)}}
  // grève
  if(S.strike>0){S.strike--;if(S.strike<=0){toast('✊ Fin de la grève','#6dffb5');logx('Fin de la grève.')}}
  S.lowMoral=S.moral<30?(S.lowMoral||0)+1:0;if(S.lowMoral>=24&&!(S.strike>0)&&!modalOpen){S.lowMoral=0;strikeEvent()}
  // vols et gaspillage
  if(S.moral<35&&Math.random()<.04){const k=['rego','food','water','rare'][Math.floor(Math.random()*4)];const lost=Math.max(1,Math.round(S[k]*(.03+Math.random()*.05)));S[k]=Math.max(0,S[k]-lost);
    toast(`📦 ${lost} ${({rego:'régolithe',food:'vivres',water:'eau',rare:'matériaux rares'})[k]} ont disparu`,'#ff9a7a');logx(`Disparition de ${lost} ${k} (moral bas).`)}
  // départs en chaîne
  if(S.chain){S.chain.left--;if(S.chain.left<=0){const fr=S.people.filter(p=>!onExp(p)&&p.j===S.chain.j);if(fr.length){const p=fr.sort((a,b)=>moodOf(a)-moodOf(b))[0];if(moodOf(p)<60){S.people=S.people.filter(x=>x!==p);S.colons--;toast(`🚶 ${p.n} suit son ami·e et repart`,'#ff8a7a');logx(`${p.n} est reparti·e à la suite d'un·e collègue.`)}}S.chain=null}}
  // demandes des colons
  if(S.req){S.req.left--;const R=REQS[S.req.k];if(R.ok()){S.moral=Math.min(100,S.moral+12);toast(`💬 Demande satisfaite : ${R.t} · moral +12`,'#6dffb5');logx(`Demande satisfaite : ${R.t}.`);S.req=null}
    else if(S.req.left<=0){S.moral-=10;toast(`💬 Demande ignorée : ${R.t} · moral −10`,'#ff8a7a');logx(`Demande ignorée : ${R.t}.`);S.req=null}}
  else if(S.people.length>=3&&Math.random()<.012){const ks=Object.keys(REQS).filter(k=>!REQS[k].ok()&&(!REQS[k].can||REQS[k].can()));if(ks.length){const k=ks[Math.floor(Math.random()*ks.length)];const p=S.people[Math.floor(Math.random()*S.people.length)];S.req={k,left:48,by:p.n};toast(`💬 ${p.n.split(' ')[0]} : « ${REQS[k].q} »`,'#9fe0ff');logx(`Demande de ${p.n} : ${REQS[k].t}.`)}}
}
const REQS={

};
function strikeEvent(){prest(-3,'grève');modalOpen=true;const e={tag:'✊ SOCIAL',t:'Les colons font grève',p:'Le moral est au plus bas depuis trop longtemps. Les colons cessent le travail et exigent des mesures.',
  c:[{b:'Accorder 24 h de repos',d:'Production arrêtée 24 h · moral +20 · fatigue effacée',f:()=>{S.shelter=Math.max(S.shelter,24);S.moral+=20;S.people.forEach(p=>p.fat=0)}},
     {b:'Distribuer des rations bonus',d:'−60 vivres · −40 eau · moral +14',ok:()=>S.food>=60&&S.water>=40,f:()=>{S.food-=60;S.water-=40;S.moral+=14}},
     {b:'Refuser',d:'Grève de 48 h (production ×0,3) · moral −5',f:()=>{S.strike=48;S.moral-=5}}]};
  $('#mbox').innerHTML=`<span class="tag">${e.tag}</span><h3>${e.t}</h3><p>${e.p}</p>`+e.c.map((c,i)=>{const ok=!c.ok||c.ok();return `<button class="choice" data-i="${i}" ${ok?'':'disabled style="opacity:.4"'}><b>${c.b}</b><div>${c.d}</div></button>`}).join('');
  $('#modal').classList.add('show');$('#mbox').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.disabled)return;e.c[+b.dataset.i].f();S.moral=clamp(S.moral,0,100);logx('Grève : '+e.c[+b.dataset.i].b+'.');$('#modal').classList.remove('show');modalOpen=false;save()})}

/* ================== ÉCONOMIE : CRÉDITS ================== */
const GOODS={rego:{n:'Régolithe',i:'⛏',p:.4,lot:100},rare:{n:'Matériaux rares',i:'🔩',p:24,lot:5},sci:{n:'Données scientifiques',i:'🔬',p:11,lot:10},water:{n:'Glace / eau',i:'💧',p:1.6,lot:50},he3:{n:'Hélium-3',i:'⚛️',p:42,lot:5}};
const SHOP=[{k:'water',q:100,c:190},{k:'food',q:100,c:210},{k:'o2',q:100,c:170},{k:'rare',q:10,c:330},{k:'rego',q:500,c:280}];
const SHOPN={water:['💧','Eau'],food:['🌱','Vivres'],o2:['💨','Oxygène'],rare:['🔩','Matériaux rares'],rego:['⛏','Régolithe']};
function ecoInit(){if(S.cr===undefined)S.cr=600;if(S.prestige===undefined)S.prestige=20;if(S.he3===undefined)S.he3=0;S.mk=S.mk||{rego:1,rare:1,sci:1,water:1,he3:1};S.mkh=S.mkh||{};S.orders=S.orders||[];S.recruits=S.recruits||[];S.contracts=S.contracts||[];if(!S.contracts.length)for(let i=0;i<3;i++)S.contracts.push(newContract());S.bilan=S.bilan||null}
const price=k=>Math.max(.05,GOODS[k].p*S.mk[k]*(S.mkEv&&S.mkEv.k===k?S.mkEv.m:1));
const subsidy=()=>Math.round(50+S.prestige*2.2);
const salaries=()=>S.colons*4;
const rent=()=>20+S.b.length*2;
const tourists=()=>S.st&&S.st.built&&!(S.st.down>0)?S.st.m.filter(m=>m.t==='habO').length*30:0;
const fmtC=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('fr-FR');
function prest(d,why){S.prestige=clamp(S.prestige+d,0,100);if(why&&Math.abs(d)>=3)toast(`⭐ Prestige ${d>0?'+':''}${d} · ${why}`,d>0?'#ffd36b':'#ff9a7a')}
const CT_N=['Agence spatiale européenne','Lunar Mining Corp.','Université de Kyoto','Fondation Artemis','Institut Pasteur spatial','Orbital Logistics','Musée de l\'Air et de l\'Espace','Helios Energy'];
function newContract(){const ks=['rego','rare','sci','water','he3'].filter(k=>k!=='he3'||(S.b&&S.b.some(b=>b.t==='helium3')));const k=ks[Math.floor(Math.random()*ks.length)];const base={rego:400,rare:12,sci:30,water:200,he3:10}[k];
  const q=Math.round(base*(.7+Math.random()*.9+(S.prestige||0)/120));const days=3+Math.floor(Math.random()*4);const rew=Math.round(q*GOODS[k].p*(1.7+(S.prestige||0)/80));
  return{id:Math.random().toString(36).slice(2,8),k,q,days,rew,pr:Math.round(2+q*GOODS[k].p/150),by:CT_N[Math.floor(Math.random()*CT_N.length)],acc:false,left:null}}
function dailyEco(){
  // marché : marche aléatoire des prix
  for(const k in GOODS){S.mk[k]=clamp(S.mk[k]*(1+(Math.random()-.5)*.24),.5,2.1);(S.mkh[k]=S.mkh[k]||[]).push(+price(k).toFixed(2));if(S.mkh[k].length>12)S.mkh[k].shift()}
  if(S.mkEv){S.mkEv.left--;if(S.mkEv.left<=0)S.mkEv=null}
  else if(Math.random()<.18){const ev=[['he3',2.2,'📈 Pénurie d\'hélium-3 sur Terre : prix ×2,2'],['rare',1.8,'📈 Les usines terriennes s\'arrachent les métaux rares : prix ×1,8'],['sci',2,'📈 Course aux brevets : vos données valent ×2'],['rego',.5,'📉 Effondrement du cours du régolithe : prix ÷2'],['water',1.9,'📈 Sécheresse sur Terre : la glace lunaire vaut ×1,9']][Math.floor(Math.random()*5)];
    S.mkEv={k:ev[0],m:ev[1],left:3};toast(ev[2],'#ffd36b');logx('Bourse : '+ev[2].slice(3)+' (3 sols).')}
  // bilan du sol
  const sub=subsidy(),sal=salaries(),rt=rent(),tour=tourists(),loanI=S.loan?Math.round(S.loan.owe*.02):0;
  S.cr+=sub+tour-rt;if(S.loan){S.loan.owe+=loanI}
  let paid=true;if(S.cr>=sal){S.cr-=sal;S.unpaid=0}else{paid=false;S.unpaid=(S.unpaid||0)+1;S.moral-=10;toast('💸 Salaires impayés ! Moral −10','#ff8a7a');logx('Salaires impayés.');if(S.unpaid>=2&&!(S.strike>0)){S.lowMoral=24}}
  S.bilan={sub,sal:paid?sal:0,rt,tour,loanI,unpaid:!paid};
  // contrats
  for(const c of S.contracts)if(c.acc){c.left--;if(c.left<=0){prest(-5,'contrat raté');toast(`📜 Contrat raté : ${c.by}`,'#ff8a7a');logx(`Contrat raté (${c.by}).`);c.dead=1}}
  S.contracts=S.contracts.filter(c=>!c.dead);if(S.contracts.filter(c=>!c.acc).length<3&&S.sol%2===0)S.contracts.push(newContract());
  // prêt
  if(S.loan){S.loan.left--;if(S.loan.left===2)toast('🏦 Remboursement du prêt dans 2 sols','#ffb36b');if(S.loan.left<=0&&!S.embargo){S.embargo=true;prest(-15,'prêt non remboursé');toast('⛔ Embargo : la Terre suspend les navettes jusqu\'au remboursement','#ff6a5a');logx('Embargo terrien : prêt non remboursé.')}}
  if(S.cr<0){S.cr=0}
  // prestige naturel
  if(S.moral>70)prest(1);if(S.moral<30)prest(-1)}
function sell(k,q){if(!S.b.some(b=>(b.t==='pad'||b.t==='spatioport')&&!b.dmg))return toast('🚀 Il faut un pas de tir pour exporter');if(S.embargo)return toast('⛔ Embargo en cours');q=Math.min(q,Math.floor(S[k]));if(q<=0)return;const g=Math.round(q*price(k)*.9);S[k]-=q;S.cr+=g;
  S.mk[k]=Math.max(.5,S.mk[k]*(1-Math.min(.25,q*GOODS[k].p/4000)));toast(`💰 +${fmtC(g)} cr · ${q} ${GOODS[k].i} vendus`,'#ffd36b');logx(`Export : ${q} ${GOODS[k].n} pour ${g} cr.`);save()}

     `<div class="card"><div class="row"><b>⭐ Prestige ${Math.round(S.prestige)}/100</b><span style="font-size:12px;color:#9aa6c8">subvention +${Math.round(S.prestige*2.2)}</span></div><div class="ibar"><span style="width:${S.prestige}%;background:linear-gradient(90deg,#ffb347,#ffd36b)"></span></div><p>Il monte avec les objectifs, les contrats, les expéditions et le bon moral. Il baisse avec les décès, les grèves et les dettes.</p></div>`+

const TREE={serreled:[0,0,null],forage:[1,0,null],parc:[0,1,'serreled'],inge:[1,1,'forage'],vaccin:[0,2,'parc'],panneaux:[1,2,'inge'],champ:[0,3,'vaccin'],fusion:[1,3,'panneaux'],he3:[0,4,'fusion'],navette:[1,4,'panneaux']};
let resSel=null;
function resState(r){if(has(r.id))return'done';const pre=TREE[r.id]&&TREE[r.id][2];if(pre&&!has(pre))return'lock';return'av'}
function renderResearch(){const rs=rates.sci||0;const W=Math.min(520,innerWidth)-28,cw=(W-14)/2,RH=92;
  if(!resSel||resState(RESEARCH.find(r=>r.id===resSel))!=='av'){const av=RESEARCH.filter(r=>resState(r)==='av').sort((a,b)=>a.cost-b.cost)[0];resSel=av?av.id:null}
  const pos=id=>{const [c,r]=TREE[id];return{x:c*(cw+14)+cw/2,y:r*RH+38}};
  let svg=`<svg width="${W}" height="${5*RH}" style="position:absolute;left:0;top:0">`;for(const [id,[c,r,pre]] of Object.entries(TREE)){if(!pre)continue;const a=pos(pre),b=pos(id);const on=has(pre);

  const nodes=RESEARCH.filter(r=>TREE[r.id]).map(r=>{const [c,row,pre]=TREE[r.id];const s=resState(r);const left=c*(cw+14),top=row*RH+6;const p=Math.min(1,S.sci/r.cost);const eta=s==='av'&&S.sci<r.cost?(rs>0?`prêt dans ${Math.ceil((r.cost-S.sci)/rs)} h`:'labo requis'):'';
    return `<div class="rnode ${s}${resSel===r.id?' sel':''}" data-r="${r.id}" style="left:${left}px;top:${top}px;width:${cw}px"><b>${r.icon} ${r.name}</b><small>${s==='done'?'✓ Acquis':s==='lock'?'🔒 après '+RESEARCH.find(x=>x.id===pre).name:`🔬 ${r.cost}${eta?' · '+eta:' · disponible'}`}</small>${s==='av'?`<div class="rbar"><span style="width:${p*100}%"></span></div>`:''}</div>`}).join('');
